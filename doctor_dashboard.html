<!doctype html>
<html>
  <head>
    <title>Doctor Dashboard</title>

    <style>
      body {
        font-family: Arial;
        margin: 30px;
        background: #f4f6f9;
      }

      .card {
        background: white;
        padding: 20px;
        margin-bottom: 20px;
        border-radius: 10px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      }

      table {
        width: 100%;
        border-collapse: collapse;
      }

      th,
      td {
        border: 1px solid #ddd;
        padding: 10px;
        text-align: left;
      }

      th {
        background: #007bff;
        color: white;
      }
    </style>
  </head>

  <body>
    <h1>Doctor Dashboard</h1>

    <div class="card">
      <h2>Doctor Statistics</h2>
      <div id="dashboard"></div>
    </div>

    <div class="card">
      <h2>Next Patient</h2>
      <div id="nextPatient"></div>
    </div>

    <div class="card">
      <h2>Estimated Wait Time</h2>
      <div id="waitTime"></div>
    </div>

    <div class="card">
      <h2>Today's Patients</h2>

      <table>
        <thead>
          <tr>
            <th>Appointment ID</th>
            <th>Patient Name</th>
            <th>Time</th>
            <th>Priority</th>
            <th>Status</th>
          </tr>
        </thead>

        <tbody id="patientTable"></tbody>
      </table>
    </div>

    <script>
        const doctorId = {{ doctor_id }};

        async function refreshDashboard() {
          const dashboard = await fetch(`/dashboard/doctor/${doctorId}`).then(
            (r) => r.json(),
          );

          const next = await fetch(`/appointments/next/${doctorId}`).then((r) =>
            r.json(),
          );

          const wait = await fetch(`/appointments/wait-time/${doctorId}`).then(
            (r) => r.json(),
          );

          const patients = await fetch(`/doctor/patients/${doctorId}`).then((r) =>
            r.json(),
          );

          document.getElementById("dashboard").innerHTML = `
          Doctor: ${dashboard.doctor_name}<br>
          Avg Consultation Time: ${dashboard.avg_consultation_time_minutes} min<br>
          Total Appointments: ${dashboard.total_appointments_today}<br>
          Completed: ${dashboard.completed_today}<br>
          Waiting: ${dashboard.patients_waiting}
      `;

          document.getElementById("nextPatient").innerHTML = next.message
            ? next.message
            : `Patient ID: ${next.patient_id}
            | Priority: ${next.priority_level}
            | Time: ${next.time}`;

          document.getElementById("waitTime").innerHTML =
            `${wait.estimated_wait_time_minutes} minutes`;

          let rows = "";

          patients.forEach((p) => {
            rows += `
          <tr>
              <td>${p.appointment_id}</td>
              <td>${p.patient_name}</td>
              <td>${p.time}</td>
              <td>${p.priority}</td>
              <td>${p.status}</td>
          </tr>`;
          });

          document.getElementById("patientTable").innerHTML = rows;
        }

        refreshDashboard();
        setInterval(refreshDashboard, 10000);
    </script>
  </body>
</html>
