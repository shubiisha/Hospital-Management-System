<!doctype html>
<html>
  <head>
    <title>Smart Hospital Scheduler</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>

  <body>
    <header>
      <h1>Smart Hospital Appointment System</h1>
    </header>
    <div class="card">
      <h2>Doctor Dashboards</h2>

      <div class="doctor-cards">
        <div class="doctor-card" onclick="openDoctorDashboard(1)">
          <h3>🫀 Dr. Mehta</h3>
          <p>Cardiology</p>
        </div>

        <div class="doctor-card" onclick="openDoctorDashboard(2)">
          <h3>🩹 Dr. Sharma</h3>
          <p>Dermatology</p>
        </div>

        <div class="doctor-card" onclick="openDoctorDashboard(3)">
          <h3>🩺 Dr. Iyer</h3>
          <p>General Physician</p>
        </div>
      </div>
    </div>
    <div class="container">
      <div class="card">
        <h2>Book Appointment</h2>

        <input id="patient_name" placeholder="Patient Name" />

        <input id="patient_age" placeholder="Age" />

        <select id="doctor_id" onchange="loadSlots()">
          <option value="">Select Doctor</option>
          <option value="1">Dr. Cardio</option>
          <option value="2">Dr. Derma</option>
          <option value="3">Dr. General Physician</option>
        </select>
        <input type="date" id="date" onchange="loadSlots()" />
        <select id="time">
          <option>Select Date First</option>
        </select>
        <input type="number" id="priority" placeholder="Priority Level" />
        <select id="visit_type">
          <option value="new">New Patient</option>
          <option value="followup">Follow Up</option>
        </select>
        <button onclick="bookAppointment()">Book Appointment</button>

        <p id="result"></p>
      </div>

      <div class="card">
        <h2>Next Patient Queue</h2>

        <select id="doctor_queue">
          <option value="">Select Doctor</option>
          <option value="1">Dr. Cardio</option>
          <option value="2">Dr. Derma</option>
          <option value="3">Dr. General Physician</option>
        </select>
        <button onclick="getNextPatient()">Check Queue</button>

        <div class="output" id="queue"></div>
      </div>

      <div class="card">
        <h2>AI Consultation Prediction</h2>

        <input type="number" id="appointment_id" placeholder="Appointment ID" />

        <button onclick="predictTime()">Predict Time</button>

        <div class="output" id="prediction"></div>
      </div>
      <div class="card">
        <h2>Update Appointment Status</h2>

        <input type="number" id="status_id" placeholder="Appointment ID" />

        <select id="status_value">
          <option value="Arrived">Arrived</option>
          <option value="In Consultation">In Consultation</option>
          <option value="Completed">Completed</option>
        </select>

        <button onclick="updateStatus()">Update Status</button>

        <div class="output" id="status_result"></div>
      </div>
    </div>

    <script src="/static/script.js"></script>
  </body>
</html>
